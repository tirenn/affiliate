services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: affiliate-backend:latest
    container_name: affiliate-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    networks:
      - affiliate-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - INTERNAL_API_URL=${INTERNAL_API_URL}
    image: affiliate-frontend:latest
    container_name: affiliate-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend
    networks:
      - affiliate-net
      - tirenn-net

networks:
  affiliate-net:
    name: affiliate-net
  tirenn-net:
    external: true

  <text x="600" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">End-to-end operational workflow of the Autonomous Threads Affiliate Marketing Bot</text>

